name: pslc-agent
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pslc
      POSTGRES_DB: pslc
      POSTGRES_PASSWORD: ${PSLC_POSTGRES_PASSWORD:?Set PSLC_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pslc_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pslc -d pslc"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  pslc_pgdata:
